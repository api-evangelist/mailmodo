free_tier:
  signup: https://manage.mailmodo.com/auth/signup
  credit_card_required: false
  allowance: >-
    Mailmodo's own copy is inconsistent: the developer landing page offers "10,000 free emails/month",
    the transactional-email FAQ says the free plan sends "up to 1K emails per day", and the
    @mailmodo/cli login flow reports totalFreeRemaining 500 on the mailmodo.dev product.
  note: Free-tier sends are real sends against real recipients — there is no suppressed test outbox.
caveats:
  - >-
    The Prism mocks are Stoplight infrastructure, not a Mailmodo-operated environment. They are as
    accurate as the published spec and no more, they can disappear whenever Mailmodo changes docs
    plan, and Mailmodo does not document or support them.
  - >-
    Because there is no test mode on the live API, an agent has no safe way to exercise
    triggerCampaign or bulktriggerCampaign end to end. Every successful call delivers mail.
