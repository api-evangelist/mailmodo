apiCommonsPlans: "0.1"
generated: '2026-08-13'
method: searched
source: https://www.mailmodo.com/pricing/
provider: mailmodo
name: Mailmodo Plans & Pricing
description: >-
  Mailmodo publishes three self-service tiers on its pricing page — Lite, Pro and Max — priced from a
  500-contact base, with annual billing saving 20%. Max is the custom/enterprise tier. Every tier
  includes the full AI feature set (template generator, automation builder, marketing planner,
  performance analyzer, segment generator) and API access; what actually scales across tiers is
  sending credits, team seats, active journeys, custom domains and the API request-per-second
  ceiling. Re-read from the live pricing page on 2026-08-13: the tier lineup has changed since this
  file was first written (a "Starter" tier is gone and "Enterprise" is now "Max").
currency: USD
billing_note: Prices shown are the annual-billing monthly rate at the 500-contact base tier.
plan_count: 3
