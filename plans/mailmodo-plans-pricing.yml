contact_tier_pricing:
  note: >-
    Mailmodo publishes an annual price ladder by contact volume in its comparison table. The first
    column is Mailmodo's own price.
  ladder:
    - contacts: 10000
      price: 59
    - contacts: 25000
      price: 119
    - contacts: 50000
      price: 199
    - contacts: 75000
      price: 343
    - contacts: 100000
      price: 399
free_tier:
  signup: https://manage.mailmodo.com/auth/signup
  credit_card_required: false
  note: >-
    Mailmodo's free-tier copy is inconsistent across its own properties: the developer landing page
    advertises 10,000 free emails/month, the transactional-email FAQ says up to 1,000 emails/day, and
    the @mailmodo/cli login flow reports totalFreeRemaining of 500. Not resolvable from public pages.
second_product_line:
  name: mailmodo.dev (@mailmodo/cli + @mailmodo/sdk)
  billing_model: >-
    Free tier plus prepaid "email blocks" of 1,000 emails each, purchased via Stripe checkout from
    the CLI (`mailmodo billing --purchase <n>`), with an optional monthly cap and auto-refill.
  price_per_block: not-published
  note: >-
    This product has NO pricing page. Its billing surface is documented only in the CLI README, and
    the block price is nowhere public. Recorded as a gap, not guessed.
discounts:
  - NGO / not-for-profit discounted plans (terms apply)
  - 20% saving on annual billing
