source: >-
  mcp/mailmodo-mcp.yml (tools transcribed from github.com/mailmodo/mailmodo-mcp src/server.ts) bound
  against the operationIds in openapi/*.yml and the provider-published specs in openapi/_original/.
name: Mailmodo MCP -> REST Tool Crosswalk
description: >-
  Binds every tool and resource in Mailmodo's first-party MCP server to the OpenAPI operation that
  backs it, so an agent can recover the real request/response contract for each tool. Mailmodo's MCP
  server is a thin wrapper over api.mailmodo.com/api/v1 — the HTTP calls are visible in
  src/apicalls/*.ts — so nearly every binding is direct and high confidence. The live MCP schema is
  auth-gated (tools/list returns "No valid mmApiKey provided"), so bindings are established from the
  provider's source plus path/verb identity, not from an introspected schema.

surfaces:
  openapi:
    files:
      - openapi/mailmodo-campaigns-api-openapi.yml
      - openapi/mailmodo-contacts-api-openapi.yml
      - openapi/mailmodo-contact-lists-api-openapi.yml
      - openapi/mailmodo-events-api-openapi.yml
      - openapi/mailmodo-templates-api-openapi.yml
      - openapi/mailmodo-user-journeys-api-openapi.yml
      - openapi/mailmodo-dynamic-form-api-openapi.yml
      - openapi/mailmodo-repeatable-block-api-openapi.yml
    gated: false
  mcp:
    url: https://mcp.app.mailmodo.com/mcp
    gated: true
    gate: 'HTTP 400 {"code":-32000,"message":"Bad Request: No valid mmApiKey provided"}'
  graphql:
    endpoint: null
    note: Mailmodo publishes no GraphQL surface.

