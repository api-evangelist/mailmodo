mcp_only:
  - tool: currentDateTime
    reason: >-
      Local helper computed inside the server with Intl.DateTimeFormat. No Mailmodo API call, no
      backing REST operation. Present so an agent can resolve relative dates before building the
      fromDate/toDate window for MailmodoCampainReportTool.

rest_only:
  - operation: post-hooks-start-journey-id
    api: User Journeys
    binding: POST https://api.mailmodo.com/hooks/start/{journey-id}
    note: Adding a user to an automated journey has no MCP tool.
  - operation: post-hooks-abort-journey-id
    api: User Journeys
    binding: POST https://api.mailmodo.com/hooks/abort/{journey-id}
    note: Aborting a journey for a user has no MCP tool.
  - operation: post-triggerCampaign-campaign-id
    api: Dynamic Form
    binding: POST https://api.mailmodo.com/api/v1/triggerCampaign/{campaign-id}
    note: >-
      Same path as sendEmailToCampaign, but the dynamic-form payload variant (a `form` object) is not
      expressible through the MCP tool's parameter set.
  - operation: post-triggerCampaign-campaign-id
    api: Repeatable Block
    binding: POST https://api.mailmodo.com/api/v1/triggerCampaign/{campaign-id}
    note: Repeatable-block payload variant is not reachable from any MCP tool.
  - operation: updateSubscription
    api: Contact Management
    binding: POST https://api.mailmodo.com/api/v1/contacts/updateSubscription
    note: >-
      Granular per-email-type subscription updates have no MCP tool; only the blunt
      unsubscribe/resubscribe pair is exposed.

