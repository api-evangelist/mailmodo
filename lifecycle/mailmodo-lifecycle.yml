      Fifteen months without a release. This is the only agent-facing wrapper over the documented
      REST API, and it is the least-maintained first-party package Mailmodo ships.
  - artifact: developers.mailmodo.com Stoplight project
    updated: '2025-11-06'
    note: default_branch.updated_at reported by the Stoplight project API for prj:73897.

observations:
  - >-
    Mailmodo is effectively running two API products at once. api.mailmodo.com (this repo's OpenAPI)
    is documented and stable-but-static; api.mailmodo.dev (the @mailmodo/sdk + @mailmodo/cli
    lifecycle-email product) is shipping constantly and has NO published contract of any kind — no
    OpenAPI, no llms.txt, no reference. Probed api.mailmodo.dev/openapi.json -> 404,
    api.mailmodo.dev/ -> 200 {"data":"I am healthy"}.
  - >-
    User Journeys endpoints (/hooks/start, /hooks/abort) sit outside the /api/v1 prefix, so a future
    v2 cut of the versioned surface would leave them stranded on an unversioned path.
