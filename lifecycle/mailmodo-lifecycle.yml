method: searched
source: >-
  https://status.mailmodo.com/ (probed 200), https://www.mailmodo.com/developers/,
  https://registry.npmjs.org/@mailmodo/mcp, and the provider-published OpenAPI in openapi/_original/.
name: Mailmodo API Lifecycle
description: >-
  Mailmodo runs a public status page and versions its REST API in the URI path, but publishes no
  deprecation policy, no sunset commitment, no changelog and no SLA. The specs carry no `deprecated`
  flags. The strongest lifecycle signal available is release cadence in the npm registry, which shows
  the api.mailmodo.com surface and its MCP server going quiet while a second, newer product line
  (mailmodo.dev) ships weekly.

versioning:
  scheme: uri-path
  current: v1
  since: '2021'
  breaking_change_policy: none-published
  note: >-
    Every published spec has been at version 1.0 since the docs project was created in July 2021. No
    v2 exists and no migration guidance is published.

deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  evidence: >-
    Grepped all eight provider-published specs for `deprecated: true` and for Sunset/Deprecation
    header declarations — zero hits. No deprecation or end-of-life page exists on mailmodo.com.

status_page:
  url: https://status.mailmodo.com/
  status: 200
  probed: '2026-08-13'
  machine_readable: false
  note: >-
    Custom single-page status site, not Statuspage/Instatus — /api/v2/status.json and /summary.json
    both return the SPA HTML shell rather than JSON, so there is no subscribable status feed.

sla:
  published: false
  uptime_target: null
  support_tiers:
    - plan: Lite
      support: Chat & email
    - plan: Pro
      support: Chat & email
    - plan: Max
      support: Dedicated chat, email & call

changelog:
