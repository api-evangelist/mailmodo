    remediation: Validate the address before sending; the HTTP status will still be 200.
    source: openapi/_original/mailmodo-dynamic-form-openapi.json
  - id: static-segmentation-list
    status: 400
    envelope_success: false
    message: Cannot add users to static segmentation list
    operations:
