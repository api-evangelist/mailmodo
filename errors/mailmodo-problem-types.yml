name: Mailmodo Error Catalog
description: >-
  Mailmodo does not publish an error reference page and does not use RFC 9457 problem+json. Errors
  arrive as a two-field JSON object — {success, message} — where `message` is free English prose with
  no stable machine-readable code. This catalog enumerates every 4xx/5xx response declared across the
  eight published specs and every distinct message string the specs give as an example, so an agent
  has something to match on. There is no error-code taxonomy to derive because the provider does not
  publish one.
format: proprietary
rfc9457: false
error_code_field: null
envelope:
  success: boolean
  message: string
status_codes:
  - status: 200
    meaning: >-
      Request accepted OR business-rule failure. Mailmodo returns 200 with "success": false for
      several validation failures — see problem_types below.
  - status: 400
    meaning: Bad Request. The only error status declared anywhere in the published specs.
  - status: 401
    meaning: >-
      Not declared in any spec, but the Prism mocks and the MCP endpoint both return 401/400 when the
      mmApiKey credential is missing. Behaviour of the live API on a bad key is undocumented.
  - status: 404
    meaning: >-
      Emitted by the api.mailmodo.com gateway for unrouted paths, with a DIFFERENT envelope:
      {"error":"error","message":"Some Internal Error Occurred: 404"}.
  - status: 429
    meaning: >-
      Undocumented. Per-second limits exist by plan (5/10/50 req/s) but no exhaustion status, header
      or body is published.
problem_types:
