undeclared:
  - >-
    No 401, 403, 409, 422, 429 or 5xx response is declared on ANY operation in ANY of the eight
    published specs. An agent has no published contract for authentication failure, permission
    failure, conflict, rate-limit exhaustion or server error.
  - >-
    Campaign Data (/api/v1/campaigns, /api/v1/campaignReports/{campaignId}) and Templates
    (/api/v1/getAllTemplates) declare NO error responses at all — only 200.
