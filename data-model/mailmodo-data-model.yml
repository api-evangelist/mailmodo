name: Mailmodo Data Model
description: >-
  The entity graph behind the Mailmodo REST API, recovered from the published specs. Mailmodo inlines
  almost every schema — across all eight documents there is exactly ONE named component schema
  (`Form`) — so the relationships below are reconstructed from id-reference FIELDS and from the shapes
  of the example payloads, not from $ref edges. Identifiers are bare UUID v4 with no type prefix, so
  an id alone does not tell an agent (or a human) which entity it belongs to.
identifier_convention:
  format: UUID v4
  prefixes: none
  note: >-
    campaignId, listId, journey-id, templateId, contactIdentifier and the returned `ref` are all
    undifferentiated UUIDs. Contacts are addressed by EMAIL in every write operation; contactIdentifier
    appears only as an output of getContactDetails.
entities:
