gaps:
  - >-
    No read operation exists for Journey, and no write operation exists for Template or Campaign —
    both are created only in the Mailmodo UI. An agent can trigger and report, but cannot author.
  - >-
    Contact has no update operation other than the implicit upsert inside addToList: posting an
    existing email with a new `data` object is how attributes are changed.
  - >-
    Because schemas are inlined rather than $ref'd, the same Contact shape is redeclared in at least
    six places with slightly different required fields. There is no single authoritative Contact
    schema in the published specs.
