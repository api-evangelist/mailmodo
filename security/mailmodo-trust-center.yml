controls:
  product_security:
    - Role-Based Access Control — admin, read-write and read-only roles
    - TLS 1.2+ only, modern cipher suites
  application_security:
    - Secure development lifecycle — linting, unit + integration tests, static analysis and vulnerable-dependency scanning on every commit
    - Vulnerability classes removed by architectural design
    - Passwords hashed; sensitive columns stored with application-level encryption
  infrastructure_security:
    - 100% of data encrypted in transit and at rest
    - Infrastructure as code, reviewed
    - Least-privilege IAM policies, credentials, permissions and roles
    - Network segregation — production, sandbox and staging in separate accounts, constrained by VPCs
  risk_and_compliance:
    - Annual SOC 2 Type 2 audit by third-party assessors
    - Annual third-party penetration tests
    - Subprocessor security evaluation and monitoring
  corporate_security:
    - 2FA enforced via Google Accounts with password complexity requirements
    - Security awareness training at onboarding and annually
    - Standardized onboarding/offboarding with minimum default permissions
    - Regular access reviews
    - VPN required for internal services
  physical_security:
    - No on-premise data storage
    - Badge or fingerprint building access, CCTV on premises
