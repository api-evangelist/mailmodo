name: Mailmodo Packages
description: >-
  Mailmodo publishes its client libraries exclusively to npm under the @mailmodo scope. There are no
  first-party packages on PyPI, RubyGems, Maven Central, NuGet, crates.io, Packagist or pkg.go.dev —
  each registry was queried and returned no Mailmodo-authored package. The @mailmodo scope splits
  across two product lines: the long-running mailmodo.com REST API (MCP server, MJML tool) and the
  newer AI-native lifecycle-email product on mailmodo.dev (SDK + CLI), which is where the active
  release cadence now sits.
